name: Installer checks

on:
  push:
  pull_request:

jobs:
  shell-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y jq sqlite3 shellcheck
      - name: Check both installation entry points
        run: |
          bash -n install.sh
          bash -n install_3xui_xhttp_vlessenc.sh
          shellcheck -S warning install.sh install_3xui_xhttp_vlessenc.sh
          bash -n scripts/server-speed-test.sh
          shellcheck -S warning scripts/server-speed-test.sh
          cmp install.sh install_3xui_xhttp_vlessenc.sh
      - name: Test profiles and installation transactions
        run: python3 -m unittest discover -s tests -v

  real-panel-and-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [panel_smoke, existing_panel_smoke, performance_panel_smoke, runtime_smoke, server_speed_smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Validate against 3x-ui v3.11.0 and its bundled Xray
        run: |
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=${{ github.workspace }},target=/repo,readonly" \
            ghcr.io/mhsanaei/3x-ui@sha256:1628adbd9bed680d25d6f714bef4a20f132105f4612ea294952f6665dad32e5b \
            -c 'apk add --no-cache bash jq sqlite openssl iproute2 curl python3 >/tmp/test-deps.log 2>&1 &&
                cd /repo &&
                if [ "$1" = runtime_smoke ] || [ "$1" = server_speed_smoke ]; then
                  XRAY_BIN=/app/bin/xray-linux-amd64 python3 "tests/$1.py"
                else
                  bash "tests/$1.sh"
                fi' sh '${{ matrix.check }}'
